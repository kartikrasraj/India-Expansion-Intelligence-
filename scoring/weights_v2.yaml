# Scoring specification v2 — DESIGN DEFAULTS, NOT LEARNED OPTIMA.
# Weights come from blueprint section 7 (demand 25, infrastructure 20, outlook 20, labour 15,
# competition/ecosystem 10, cost/policy 10) tilted per industry using the rationale in section 7.1.
# They must be validated by expert review and the sensitivity analysis the app shows.
# A suitability index is a relative 0-100 screening score. It is NOT a probability of success.
#
# v2 (3 Nov 2026) vs v1: every industry keeps only indicators with a stated business link (`why`), so reasons and
# watch-outs shown to a user are relevant to that industry. Indicators with no defensible link were removed
# (e.g. internet subscriptions and urban unemployment for healthcare; household spending for IT services);
# healthcare gained PHC doctors per lakh and population; public hospital beds are now read as a care gap.
# Healthcare and hospitality have no ecosystem dimension: no auditable cluster indicator exists for them.
# Operational needs ADD their indicators to an industry that lacks them (e.g. digital-first adds internet
# subscriptions to healthcare) instead of being silently ignored. v1 is kept for the audit trail.

version: v2
frozen: 2026-11-03
normalisation:
  method: percentile rank against a frozen national reference (scoring/reference_v2.parquet)
  reference_set: all 28 states plus Delhi and Jammu & Kashmir, latest observation per state
  direction: "+1 = higher is better; -1 = cost or risk, scored as 100 - percentile"
  missing: "never filled. Indicator dropped and weights renormalised within the dimension; a dimension with no
    observed indicator is dropped and dimension weights are renormalised. Both are disclosed per state."
  quality_admitted: [official, derived]   # secondary / private values are displayed, never scored

reasons:
  # strengths and watch-outs: indicator score vs the mean score of the OTHER compared states, weighted by the
  # user's effective weights. Reported only if the score gap is at least min_gap percentile points AND the raw
  # difference from the peer median is material: at least the indicator's min_diff (in its own unit; set for rates
  # and percentages) or, where no min_diff is set, at least min_rel_diff of the peer median.
  min_gap: 5
  min_rel_diff: 0.05

dimensions:
  demand: {label: "Market demand", default_weight: 25}
  infrastructure: {label: "Infrastructure", default_weight: 20}
  outlook: {label: "Economic outlook", default_weight: 20}
  labour: {label: "Labour availability", default_weight: 15}
  ecosystem: {label: "Business ecosystem / competition", default_weight: 10,
              note: "High density can mean a valuable cluster OR a saturated market; scored as cluster depth."}
  cost: {label: "Operating cost & policy", default_weight: 10,
         note: "No auditable numeric policy indicator exists; DPIIT ranking is ordinal and informational only."}

# Indicator catalogue. feature = code in fact_indicator (see etl/build_indicators.py for derived ones).
# hi / lo: plain-language meaning of a value above / below the other compared states (direction-free).
indicators:
  gsdp_rs_crore:            {label: "Economy size (real GSDP)", unit: "Rs crore, 2011-12 prices", direction: 1, transform: log,
                             hi: "a larger economy", lo: "a smaller economy"}
  population_derived:       {label: "Population", unit: "persons", direction: 1, transform: log,
                             proxy: "derived as NSDP / per-capita NSDP", hi: "a larger population", lo: "a smaller population"}
  per_capita_nsdp_real:     {label: "Per-capita income (real NSDP)", unit: "Rs, 2011-12 prices", direction: 1,
                             hi: "higher average incomes", lo: "lower average incomes"}
  mpce_urban:               {label: "Urban household spending (MPCE)", unit: "Rs/person/month", direction: 1, proxy: "survey snapshot 2023-24",
                             hi: "urban households spend more", lo: "urban households spend less"}
  mpce_rural:               {label: "Rural household spending (MPCE)", unit: "Rs/person/month", direction: 1, proxy: "survey snapshot 2023-24",
                             hi: "rural households spend more", lo: "rural households spend less"}
  personal_loans_per_capita: {label: "Personal bank loans per person", unit: "Rs", direction: 1,
                             hi: "households borrow more for purchases", lo: "thinner consumer credit"}
  exports_usd_mn:           {label: "Merchandise exports", unit: "USD million", direction: 1, transform: log,
                             hi: "a larger export base", lo: "a smaller export base"}
  domestic_tourist_visits:  {label: "Domestic tourist visits", unit: "million", direction: 1, transform: log,
                             proxy: "visits, not unique people or room nights", hi: "more domestic visitors", lo: "fewer domestic visitors"}
  foreign_tourist_visits:   {label: "Foreign tourist visits", unit: "million", direction: 1, transform: log,
                             hi: "more foreign visitors", lo: "fewer foreign visitors"}
  power_shortage_pct:       {label: "Energy shortage", min_diff: 0.1, unit: "% of requirement not supplied", direction: -1,
                             proxy: "state-level shortage, not plant-level outages or tariff",
                             hi: "power supply falls short of demand more often", lo: "power supply meets demand more reliably"}
  peak_unmet_pct:           {label: "Peak demand not met", min_diff: 0.1, unit: "%", direction: -1,
                             hi: "peak demand goes unmet more often", lo: "peak demand is met"}
  per_capita_power_availability: {label: "Power availability per person", unit: "kWh", direction: 1,
                             hi: "more power available per person", lo: "less power available per person"}
  internet_subs_per_100:    {label: "Internet subscriptions per 100", unit: "per 100 population", direction: 1,
                             proxy: "subscriptions, not measured speed", hi: "wider internet adoption", lo: "lower internet adoption"}
  internet_subs_per_100_urban: {label: "Urban internet subscriptions per 100", unit: "per 100 population", direction: 1,
                             hi: "wider urban internet adoption", lo: "lower urban internet adoption"}
  nh_km_per_lakh_pop:       {label: "National highways per lakh people", unit: "km", direction: 1, proxy: "length, not transit time",
                             hi: "a denser highway network per person", lo: "a thinner highway network per person"}
  rail_km_per_lakh_pop:     {label: "Railway route per lakh people", unit: "km", direction: 1,
                             hi: "a denser rail network per person", lo: "a thinner rail network per person"}
  momentum_manufacturing:   {label: "Manufacturing real growth, 3-yr mean", min_diff: 0.5, unit: "% a year", direction: 1,
                             hi: "faster recent manufacturing growth", lo: "slower recent manufacturing growth"}
  momentum_services:        {label: "Services real growth, 3-yr mean", min_diff: 0.5, unit: "% a year", direction: 1,
                             proxy: "broad services aggregate, not sector-specific",
                             hi: "faster recent services growth", lo: "slower recent services growth"}
  momentum_financial_services: {label: "Financial services real growth, 3-yr mean", min_diff: 0.5, unit: "% a year", direction: 1,
                             hi: "faster recent financial-services growth", lo: "slower recent financial-services growth"}
  momentum_gsva_total:      {label: "Whole-economy real growth, 3-yr mean", min_diff: 0.5, unit: "% a year", direction: 1,
                             hi: "faster recent economic growth", lo: "slower recent economic growth"}
  forecast_manufacturing:   {label: "Forecast: manufacturing real GSVA growth next FY", min_diff: 0.5, unit: "% a year", direction: 1,
                             requires_model: manufacturing, hi: "a stronger growth forecast", lo: "a weaker growth forecast"}
  ur_urban_us_adj:          {label: "Urban unemployment rate (labour pool)", min_diff: 0.5, unit: "%", direction: 1,
                             proxy: "higher = larger available pool; shown as supply, not as a negative",
                             hi: "more urban job-seekers to hire from", lo: "a tighter urban labour market (more hiring competition)"}
  ur_rural_us_adj:          {label: "Rural unemployment rate (labour pool)", min_diff: 0.5, unit: "%", direction: 1,
                             proxy: "higher = larger available pool",
                             hi: "more rural job-seekers to hire from", lo: "a tighter rural labour market"}
  asi_workers:              {label: "Factory workers (ASI)", unit: "persons", direction: 1, transform: log,
                             hi: "a larger experienced factory workforce", lo: "a smaller experienced factory workforce"}
  specialists_per_lakh_pop: {label: "Public-sector specialists in position per lakh", unit: "per lakh", direction: 1,
                             proxy: "public CHC specialists only", hi: "more specialist doctors per person", lo: "fewer specialist doctors per person"}
  phc_doctors_per_lakh_pop: {label: "Public PHC doctors in position per lakh", unit: "per lakh", direction: 1,
                             proxy: "public primary-care doctors only", hi: "more doctors per person", lo: "fewer doctors per person"}
  asi_factories:            {label: "Registered factories (ASI)", unit: "number", direction: 1, transform: log,
                             hi: "more registered factories", lo: "fewer registered factories"}
  share_manufacturing:      {label: "Manufacturing share of GSVA", min_diff: 0.5, unit: "%", direction: 1,
                             hi: "industry is a bigger part of the economy", lo: "industry is a smaller part of the economy"}
  share_services:           {label: "Services share of GSVA", min_diff: 0.5, unit: "%", direction: 1,
                             hi: "a more services-led economy", lo: "a less services-led economy"}
  share_financial_services: {label: "Financial services share of GSVA", min_diff: 0.5, unit: "%", direction: 1,
                             hi: "a deeper financial-services sector", lo: "a thinner financial-services sector"}
  credit_industry_share:    {label: "Bank credit going to industry", min_diff: 0.5, unit: "% of SCB credit", direction: 1,
                             hi: "banks lend more to industry", lo: "banks lend less to industry"}
  bank_offices_per_lakh_pop: {label: "Bank offices per lakh people", unit: "per lakh", direction: 1,
                             hi: "a denser bank branch network", lo: "a thinner bank branch network"}
  govt_beds_per_lakh_pop:   {label: "Public hospital beds per lakh (care gap)", unit: "per lakh", direction: -1,
                             proxy: "fewer public beds per person = more patients relying on private care; not private capacity",
                             hi: "public hospitals already cover more of the population", lo: "a wider public-bed gap for private providers to fill"}
  rural_wage_nonagri:       {label: "Rural non-farm wage (men)", unit: "Rs/day", direction: -1,
                             hi: "higher wage costs", lo: "lower wage costs"}
  rural_wage_construction:  {label: "Rural construction wage (men)", unit: "Rs/day", direction: -1,
                             hi: "higher construction wage costs", lo: "lower construction wage costs"}
  cpi_inflation_general:    {label: "Consumer price inflation", min_diff: 0.3, unit: "%", direction: -1,
                             hi: "prices rising faster", lo: "prices rising more slowly"}
  cpi_inflation_housing_urban: {label: "Urban housing inflation (rent pressure)", min_diff: 0.3, unit: "%", direction: -1,
                             hi: "urban rents rising faster", lo: "urban rents rising more slowly"}
  td_losses_pct:            {label: "Power T&D losses", min_diff: 1.0, unit: "%", direction: -1, proxy: "utility efficiency, tariff pressure",
                             hi: "higher grid losses (tariff pressure)", lo: "lower grid losses"}

# Industry profiles: dimension weights (sum 100), indicator weights within each dimension and, for every indicator,
# `why` = the business reason it is in this industry's profile (shown with each strength / watch-out).
# mandatory_dimensions: a state with no observed indicator in one of these is EXCLUDED for the industry.
industries:
  manufacturing:
    label: Manufacturing
    model_target: manufacturing            # RBI T34 real manufacturing GSVA
    mandatory_dimensions: [infrastructure, outlook, labour, cost]
    weights: {demand: 15, infrastructure: 25, outlook: 20, labour: 15, ecosystem: 15, cost: 10}
    indicators:
      demand: {gsdp_rs_crore: 2, per_capita_nsdp_real: 1, exports_usd_mn: 1}
      infrastructure: {power_shortage_pct: 2, peak_unmet_pct: 1, per_capita_power_availability: 1, nh_km_per_lakh_pop: 1, rail_km_per_lakh_pop: 1}
      outlook: {forecast_manufacturing: 2, momentum_manufacturing: 2}
      labour: {asi_workers: 2, ur_urban_us_adj: 1, ur_rural_us_adj: 1}
      ecosystem: {asi_factories: 1, share_manufacturing: 1, credit_industry_share: 1}
      cost: {rural_wage_nonagri: 2, td_losses_pct: 1, cpi_inflation_general: 1}
    why:
      gsdp_rs_crore: "A large state economy puts buyers and suppliers within reach of the plant."
      per_capita_nsdp_real: "Higher incomes support regional demand for manufactured goods."
      exports_usd_mn: "An export base signals port links, compliance know-how and overseas buyers."
      power_shortage_pct: "Production lines stop when power falls short; supply reliability protects output."
      peak_unmet_pct: "Peak-hour shortfalls hit multi-shift operations hardest."
      per_capita_power_availability: "Ample power per person indicates grid headroom for industrial loads."
      nh_km_per_lakh_pop: "Highways carry inbound inputs and outbound finished goods."
      rail_km_per_lakh_pop: "Rail moves bulk raw materials and long-haul freight cheaply."
      forecast_manufacturing: "The validated model's view of next year's manufacturing growth in the state."
      momentum_manufacturing: "Recent manufacturing growth shows whether the state's industrial base is expanding."
      asi_workers: "An existing factory workforce shortens hiring and training time."
      ur_urban_us_adj: "Supervisors, technicians and office staff are hired from the urban job-seeker pool."
      ur_rural_us_adj: "Shop-floor and contract labour is largely drawn from rural job-seekers."
      asi_factories: "More factories mean suppliers, service vendors and experienced managers nearby."
      share_manufacturing: "Manufacturing-led states tend to have industrial parks, clearances and vendor networks in place."
      credit_industry_share: "Banks used to lending to industry make working capital and term loans easier to raise."
      rural_wage_nonagri: "Non-farm wage levels drive shop-floor labour cost."
      td_losses_pct: "High grid losses push utilities towards higher industrial tariffs."
      cpi_inflation_general: "Faster inflation erodes margins through wage and input costs."
  retail:
    label: Retail
    model_target: null
    target_note: "Trade & repair GSVA is not published by state in the RBI handbook; services aggregate is a broad proxy only."
    mandatory_dimensions: [demand, outlook, cost]
    weights: {demand: 30, infrastructure: 15, outlook: 20, labour: 15, ecosystem: 10, cost: 10}
    indicators:
      demand: {mpce_urban: 2, per_capita_nsdp_real: 1, personal_loans_per_capita: 1, gsdp_rs_crore: 1}
      infrastructure: {internet_subs_per_100: 1, power_shortage_pct: 1, nh_km_per_lakh_pop: 1}
      outlook: {momentum_services: 1}
      labour: {ur_urban_us_adj: 1}
      ecosystem: {share_services: 1, bank_offices_per_lakh_pop: 1}
      cost: {cpi_inflation_housing_urban: 1, cpi_inflation_general: 1}
    why:
      mpce_urban: "Urban household spending is the most direct measure of the shopper's wallet."
      per_capita_nsdp_real: "Higher incomes mean more discretionary spending per shopper."
      personal_loans_per_capita: "Consumer credit funds big-ticket purchases such as electronics and durables."
      gsdp_rs_crore: "A larger economy means more total consumer spending to capture."
      internet_subs_per_100: "Online adoption supports digital payments and omnichannel selling."
      power_shortage_pct: "Stores need dependable power for lighting, billing and cold storage."
      nh_km_per_lakh_pop: "Highways keep store replenishment fast and cheap."
      momentum_services: "Services growth (a broad proxy that includes trade) signals rising consumer activity."
      ur_urban_us_adj: "Store and front-line staff are hired from the urban job-seeker pool."
      share_services: "A services-led economy has a larger formal, consumer-facing sector."
      bank_offices_per_lakh_pop: "Dense banking access supports card and UPI payments and cash handling."
      cpi_inflation_housing_urban: "Rising urban rents raise store lease costs."
      cpi_inflation_general: "Inflation squeezes shoppers' real spending power."
  it_services:
    label: IT / professional services
    model_target: null
    target_note: "No state IT/professional-services GSVA; services and financial-services aggregates are broad proxies."
    mandatory_dimensions: [infrastructure, labour, outlook]
    weights: {demand: 20, infrastructure: 25, outlook: 20, labour: 20, ecosystem: 10, cost: 5}
    indicators:
      demand: {gsdp_rs_crore: 1, per_capita_nsdp_real: 1}
      infrastructure: {internet_subs_per_100_urban: 1, internet_subs_per_100: 1, power_shortage_pct: 1}
      outlook: {momentum_services: 1, momentum_financial_services: 1}
      labour: {ur_urban_us_adj: 1}
      ecosystem: {share_services: 1, share_financial_services: 1}
      cost: {cpi_inflation_housing_urban: 1}
    why:
      gsdp_rs_crore: "A larger economy has more enterprises buying IT and professional services."
      per_capita_nsdp_real: "Higher incomes point to a richer corporate and professional client base."
      internet_subs_per_100_urban: "Urban connectivity is essential for delivery centres and hybrid work."
      internet_subs_per_100: "Wide internet adoption supports distributed teams and digital clients."
      power_shortage_pct: "Delivery centres need uninterrupted power to meet uptime commitments."
      momentum_services: "Services growth (a broad proxy) signals rising demand for professional services."
      momentum_financial_services: "Financial-services growth signals demand from BFSI, the largest IT buyer."
      ur_urban_us_adj: "Graduate and entry-level hires come from the urban job-seeker pool."
      share_services: "A services-led economy offers more clients and experienced talent."
      share_financial_services: "A strong financial sector puts BFSI clients close by."
      cpi_inflation_housing_urban: "Rising urban rents raise office and employee housing costs."
  logistics:
    label: Logistics
    model_target: null
    target_note: "Transport & storage GSVA is not in the handbook; whole-economy growth is used as momentum context."
    mandatory_dimensions: [infrastructure, demand]
    weights: {demand: 20, infrastructure: 30, outlook: 20, labour: 10, ecosystem: 10, cost: 10}
    indicators:
      demand: {gsdp_rs_crore: 2, exports_usd_mn: 1}
      infrastructure: {nh_km_per_lakh_pop: 2, rail_km_per_lakh_pop: 1, power_shortage_pct: 1}
      outlook: {momentum_gsva_total: 1}
      labour: {ur_urban_us_adj: 1, ur_rural_us_adj: 1}
      ecosystem: {asi_factories: 1, credit_industry_share: 1}
      cost: {rural_wage_nonagri: 1, cpi_inflation_general: 1}
    why:
      gsdp_rs_crore: "A larger economy generates more freight to move."
      exports_usd_mn: "Exports create port-bound and cross-border freight."
      nh_km_per_lakh_pop: "Highway density sets trucking reach and transit times."
      rail_km_per_lakh_pop: "Rail capacity supports bulk and long-haul container movement."
      power_shortage_pct: "Warehouses and cold chains need reliable power."
      momentum_gsva_total: "Whole-economy growth drives freight volumes."
      ur_urban_us_adj: "Warehouse, last-mile and office staff are hired from the urban pool."
      ur_rural_us_adj: "Drivers and loaders are often drawn from rural job-seekers."
      asi_factories: "Factories are the main shippers of inbound and outbound freight."
      credit_industry_share: "Industrial lending signals active manufacturing clients that need logistics."
      rural_wage_nonagri: "Wage levels drive the cost of drivers, loaders and warehouse labour."
      cpi_inflation_general: "Inflation pushes up fuel, wage and rent costs."
  healthcare:
    label: Healthcare
    model_target: null
    target_note: "Health GVA is not separable by state in the handbook; ranking only."
    mandatory_dimensions: [demand, labour]
    weights: {demand: 35, infrastructure: 20, outlook: 15, labour: 20, cost: 10}
    indicators:
      demand: {per_capita_nsdp_real: 1, mpce_urban: 1, mpce_rural: 1, population_derived: 1, govt_beds_per_lakh_pop: 1}
      infrastructure: {power_shortage_pct: 2, per_capita_power_availability: 1}
      outlook: {momentum_services: 1}
      labour: {specialists_per_lakh_pop: 1, phc_doctors_per_lakh_pop: 1}
      cost: {cpi_inflation_housing_urban: 1, cpi_inflation_general: 1}
    why:
      per_capita_nsdp_real: "Higher incomes mean more patients able to pay for private care."
      mpce_urban: "Urban household spending shows what city patients can afford."
      mpce_rural: "Rural household spending shows affordability across the wider catchment."
      population_derived: "A larger population means a larger patient base."
      govt_beds_per_lakh_pop: "Where public hospitals have fewer beds per person, more patients turn to private providers."
      power_shortage_pct: "ICUs, operating theatres and imaging cannot tolerate power cuts."
      per_capita_power_availability: "Grid capacity matters for power-hungry equipment such as MRI and dialysis."
      momentum_services: "Services growth (a broad proxy that includes health) signals rising demand for care."
      specialists_per_lakh_pop: "Specialists in public service indicate the pool of specialist doctors to recruit from."
      phc_doctors_per_lakh_pop: "Doctors in public service indicate the state's supply of medical graduates."
      cpi_inflation_housing_urban: "Rising urban rents raise the cost of clinic and hospital premises."
      cpi_inflation_general: "Inflation raises the cost of drugs, consumables and salaries."
  hospitality:
    label: Hospitality
    model_target: null
    target_note: "Hotels & restaurants GVA is bundled with trade; tourism visits give demand context only."
    mandatory_dimensions: [demand]
    weights: {demand: 40, infrastructure: 20, outlook: 15, labour: 15, cost: 10}
    indicators:
      demand: {domestic_tourist_visits: 2, foreign_tourist_visits: 1, mpce_urban: 1}
      infrastructure: {nh_km_per_lakh_pop: 1, rail_km_per_lakh_pop: 1}
      outlook: {momentum_services: 1}
      labour: {ur_urban_us_adj: 1}
      cost: {cpi_inflation_housing_urban: 1, cpi_inflation_general: 1}
    why:
      domestic_tourist_visits: "Domestic visitors are the core of hotel and restaurant demand."
      foreign_tourist_visits: "Foreign visitors bring higher room rates and longer stays."
      mpce_urban: "Urban household spending drives local dining and leisure demand."
      nh_km_per_lakh_pop: "Highways bring road-trip and weekend travellers."
      rail_km_per_lakh_pop: "Rail access brings budget and mid-market travellers."
      momentum_services: "Services growth (a broad proxy that includes hotels) signals rising activity."
      ur_urban_us_adj: "Front-desk, kitchen and service staff are hired from the urban job-seeker pool."
      cpi_inflation_housing_urban: "Rising urban rents raise property and lease costs."
      cpi_inflation_general: "Inflation raises food and operating costs."

# User controls (blueprint 8.2). Multipliers are applied to dimension weights, then renormalised.
priorities:
  max_selected: 3
  multiplier: 1.6
  map: {demand: demand, infrastructure: infrastructure, labour: labour, cost: cost, growth: outlook, policy: null}
  policy_note: "No auditable numeric policy indicator is available, so the 'policy' priority does not change scores."
# add: indicators the need ADDS (weight 1 before the multiplier) when the industry profile lacks them.
# boost: indicators the need up-weights when they are in the profile (added ones included).
operational_needs:
  power_intensive: {dimension: infrastructure, dim_multiplier: 1.25, add: [power_shortage_pct, per_capita_power_availability],
                    boost: [power_shortage_pct, peak_unmet_pct, per_capita_power_availability], indicator_multiplier: 2,
                    why: "You flagged power-intensive operations: supply reliability decides uptime."}
  digital_first: {dimension: infrastructure, dim_multiplier: 1.15, add: [internet_subs_per_100, internet_subs_per_100_urban],
                  boost: [internet_subs_per_100, internet_subs_per_100_urban], indicator_multiplier: 2,
                  why: "You flagged a digital-first model: customers and staff need to be online."}
  logistics_heavy: {dimension: infrastructure, dim_multiplier: 1.25, add: [nh_km_per_lakh_pop, rail_km_per_lakh_pop],
                    boost: [nh_km_per_lakh_pop, rail_km_per_lakh_pop], indicator_multiplier: 2,
                    why: "You flagged logistics-heavy operations: transport links set delivery time and cost."}
  skilled_labour: {dimension: labour, dim_multiplier: 1.25, add: [],
                   boost: [asi_workers, ur_urban_us_adj, specialists_per_lakh_pop, phc_doctors_per_lakh_pop], indicator_multiplier: 1.5,
                   why: "You flagged skilled-labour needs: the depth of the relevant talent pool matters more."}
stability:
  perturbation: [0.8, 1.2]   # each dimension weight independently scaled within +-20%, then renormalised
  draws: 500
  seed: 2026
