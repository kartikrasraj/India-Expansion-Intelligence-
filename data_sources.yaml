district_youth_unemployment:
  note: >
    No official source publishes district-level youth unemployment every year. Options in order of preference:
    (1) PLFS unit-level data (MoSPI microdata portal, free registration): state x rural/urban x NSS-region estimates, not district;
    (2) Census 2011 district main/marginal workers and seeking-work tables (very old);
    (3) NCS portal (ncs.gov.in) job seeker registrations by district (administrative, biased);
    (4) State employment exchange live register (state labour departments).
    The app should show youth unemployment at STATE level (and rural/urban) and say plainly that district figures don't exist.

