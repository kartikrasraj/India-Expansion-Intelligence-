mospi_gsva_state_sector:
  publisher: MoSPI / State DES
  what: State GSVA by detailed economic activity (trade & repair, hotels & restaurants, transport, storage, communication, real estate & professional services, health)
  portal: https://mospi.gov.in/
  status: A/C — locate the latest 'State-wise GSVA by economic activity' statement (2011-12 base); otherwise fall back to each state's DES / Economic Survey appendix.

mospi_gsva_base_2022_23:
  publisher: MoSPI (NSO)
  what: New series, base year 2022-23
  national_gdp_press_note: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/feb/doc2026227806401.pdf
  state_guideline_press_release: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/may/doc202657865101.pdf
  status: C — states were still being onboarded (guideline finalised May 2026; joint discussions on current-price 2022-23..2024-25 in May 2026). A full back series was expected by Dec 2026. Do NOT mix with 2011-12 base. Recheck before launch.

asi_2024_25:
  publisher: MoSPI — Annual Survey of Industries
  reference_period: 2024-25 (Apr 2024–Mar 2025); released 2026-09-30
  factsheet_pdf: https://www.mospi.gov.in/uploads/publications_reports/publications_reports1790761607830_02ca8547-c087-4c5c-9826-5d58740ee63f_Factsheet_ASI_2024-25.pdf
