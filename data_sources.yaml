  boundaries: https://github.com/wmgeolab/geoBoundaries/raw/main/releaseData/gbOpen/IND/ADM2/geoBoundaries-IND-ADM2.geojson
  status: V (run on laptop; S3 blocked from the research workspace)

internet_speed_trai:
