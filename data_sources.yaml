  use: state factories, workers, fixed capital, GVA (Annexure-II state tables)
  status: V; extract Annexure-II tables from PDF with spot checks

plfs_annual_2025:
  publisher: MoSPI — Periodic Labour Force Survey
  reference_period: calendar year 2025 (Jan–Dec) — first calendar-year report; earlier reports are July–June
  press_note_pdf: https://www.mospi.gov.in/uploads/latestReleases/latest_release_1774607827733_3e8964a9-268b-4cc9-ad65-cfc8a9e32f08_Press_note_AR_PLFS_2025_23032025_V2.1_26032026_final.pdf
  use: state LFPR, WPR, UR (usual status, 15+); find the full annual report state tables on mospi.gov.in
  status: V; break in series from 2025 (new design + calendar year) -> flag, don't splice with older years

hces_2023_24:
  publisher: MoSPI — Household Consumption Expenditure Survey
  reference_period: Aug 2023–Jul 2024
  final_report_pdf: https://mospi.gov.in/sites/default/files/publication_reports/Final_Report_HCES_2023-24L.pdf
  factsheet_pdf: https://mospi.gov.in/sites/default/files/publication_reports/HCES%20FactSheet%202023-24.pdf
  state_table_alt: https://rsdebate.nic.in/bitstream/123456789/757640/1/PQ_267_10032025_U1279_p414_p417.pdf
  use: state rural/urban MPCE (without imputation) as consumer-demand proxy
  status: V; snapshot — never interpolate into an annual series

trai_pir:
  publisher: TRAI — Indian Telecom Services Performance Indicators
  latest_quarterly: {period: "Apr–Jun 2026", released: 2026-10-12, pdf: "https://www.trai.gov.in/sites/default/files/2026-10/QPIR_12102026.pdf"}
  latest_yearly: {period: "2025-26", released: 2026-10-05, pdf: "https://trai.gov.in/sites/default/files/2026-10/YIR_05102026_0.pdf"}
  use: internet subscribers / tele-density by licensed service area
  caveat: service areas != states (e.g. Maharashtra excl. Mumbai, UP East/West, Mumbai separate). Build an explicit LSA->state map and document it.
  status: V

tourism_compendium:
  publisher: Ministry of Tourism
  compendium_2025_pdf: https://tourism.gov.in/sites/default/files/2025-09/India%20Tourism%20Data%20Compendium%202025_1.pdf
  latest_state_series_2016_2025: https://tourism.gov.in/sites/default/files/2026-03/usq.3834%20for%2016.03.2026.pdf
  use: domestic + foreign tourist visits by state (hospitality demand context)
  caveat: visits are not unique people or hotel occupancy; UP 2025 inflated by Kumbh Mela — flag as one-off
  status: V

cea_power_supply_position:
  publisher: Central Electricity Authority
  portal: https://www.cea.nic.in/reports/dashboardView?headingId=107&lang=en&source=archive&subHeadingId=1003&subSubHeadingId=10010&title=Power+Supply+Position+-+Energy
  use: annual energy requirement vs supplied, % shortage by state (latest FY 2025-26)
  status: V portal; A — confirm latest annual file

morth_roads:
  publisher: Ministry of Road Transport & Highways
  portal: https://morth.nic.in/
  use: Basic Road Statistics — road length by state; compute road density per 100 sq km
  status: A/C — latest edition to confirm

mca_company_master:
  publisher: Ministry of Corporate Affairs
  portal: https://www.mcacdm.nic.in/company-master-details
  ogd: https://data.gov.in/catalog/company-master-data
  use: active companies by registered state & activity (snapshot)
  caveat: CAPTCHA on MCA portal — use OGD files or manual download; registered office != operating site
  status: V; A

startup_ranking:
  publisher: DPIIT
  edition: 5th edition (period Jan 2023–Nov 2024), results released Jan 2026
  results_page: https://www.startupindia.gov.in/srf/result.html
  report_page: https://www.startupindia.gov.in/srf/portal/edition_5th_2026.html
  state_policies: https://www.startupindia.gov.in/content/sih/en/startup-scheme/state-startup-policies.html
  use: informational policy context only (ordinal categories, not a numeric score)
  status: V

census_2011:
  publisher: Office of the Registrar General
  portal: https://censusindia.gov.in/census.website/en/data
  use: area, urbanisation share (2011 vintage — label as such). Prefer RBI/MoHFW projected population for current per-capita ratios.
  status: V

